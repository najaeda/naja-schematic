name: Native macOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # macos-14's default Xcode (15.4) has an incomplete C++20 <ranges> lib
    # (missing std::views::join, construct_at issues) that thirdparty/naja's
    # slang dependency needs — matches thirdparty/naja's own CI, which only
    # targets macos-15/macos-26 for the same reason.
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        # capnp/tbb/boost: required by thirdparty/naja (see thirdparty/naja's
        # own .github/workflows/macos-build.yml). bison/flex: macOS ships an
        # ancient system bison/flex, so the brew ones need to come first on
        # PATH (next step).
        run: brew install sdl2 ninja capnp tbb boost bison flex

      - name: Set Homebrew bison/flex on PATH
        run: |
          echo "/usr/local/opt/flex/bin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"

      - name: Configure (native-debug preset)
        run: cmake --preset native-debug

      - name: Build
        run: cmake --build --preset native-debug

      - name: Check binary exists
        run: file ../naja-schematic-build/native-debug/naja-schematic-standalone
